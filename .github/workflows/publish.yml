name: Publish to npm

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify firebase-mcp command
        run: npx . --help

  publish:
    name: Publish to npmjs.com
    needs: test
    runs-on: ubuntu-latest
    environment: Release
    permissions:
      contents: read
      id-token: write # Required for OIDC trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set version from release tag
        run: |
          VERSION="${{ github.event.release.tag_name }}"
          VERSION="${VERSION#v}"
          npm version "$VERSION" --no-git-tag-version
          if [[ "$VERSION" == *"-"* ]]; then
            echo "PUBLISH_TAG=beta" >> "$GITHUB_ENV"
          else
            echo "PUBLISH_TAG=latest" >> "$GITHUB_ENV"
          fi

      # Authenticates via OIDC Trusted Publishing — no NPM_TOKEN needed.
      - name: Publish
        run: npm publish --provenance --access public --tag "$PUBLISH_TAG"
