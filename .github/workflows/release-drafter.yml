name: Release Drafter

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  update_release_draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: KoblerS/release-drafter@49bc6fe409213d41eaa55e6170faabfa66d49943 # v1.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          generate-release-notes: true
          version-prefix: "v"
